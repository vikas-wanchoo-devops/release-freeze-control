name: Notify Freeze Change

on:
  push:
    paths:
      - "code-freeze-config/freeze.json"

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger downstream repos
        run: |
          # Replace with the actual downstream repos you want to notify
          for repo in FlaskAPI-Docker-CICD ServiceA ServiceB; do
            echo "Dispatching freeze-updated event to $repo..."
            curl -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
              https://api.github.com/repos/vikas-wanchoo-devops/$repo/dispatches \
              -d '{"event_type":"freeze-updated"}'
          done
