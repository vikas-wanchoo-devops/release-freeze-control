name: Notify Freeze Change

on:
  push:
    paths:
      - "code-freeze-config/freeze.json"

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch freeze-updated event to all repos
        run: |
          repos=("FlaskAPI-Docker-CICD" \
                 "Terraform-Azure-ContainerApp-CI-CD" \
                 "FlaskAPI-Docker-Azure-CI-CD" \
                 "Docker_Commands_Reference")

          for repo in "${repos[@]}"; do
            echo "Dispatching freeze-updated event to $repo..."
            curl -X POST \
              -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/vikas-wanchoo-devops/$repo/dispatches \
              -d '{"event_type":"freeze-updated"}'
          done

  recheck-open-prs:
    runs-on: ubuntu-latest
    needs: notify
    steps:
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Wait for downstream workflows
        run: |
          echo "Sleeping for 20 seconds to allow downstream workflows to complete..."
          sleep 20

      - name: Re-request Code Freeze checks on open PRs
        run: |
          repos=("FlaskAPI-Docker-CICD" \
                 "Terraform-Azure-ContainerApp-CI-CD" \
                 "FlaskAPI-Docker-Azure-CI-CD" \
                 "Docker_Commands_Reference")

          for repo in "${repos[@]}"; do
            echo "======================================"
            echo "Processing repository: $repo"

            prs=$(curl -s -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/vikas-wanchoo-devops/$repo/pulls?state=open | jq -r '.[].number')

            for pr in $prs; do
              echo "--------------------------------------"
              echo "Processing PR #$pr in $repo..."

              sha=$(curl -s -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
                -H "Accept: application/vnd.github+json" \
                https://api.github.com/repos/vikas-wanchoo-devops/$repo/pulls/$pr | jq -r '.head.sha')

              suites=$(curl -s -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
                -H "Accept: application/vnd.github+json" \
                https://api.github.com/repos/vikas-wanchoo-devops/$repo/commits/$sha/check-suites \
                | jq -r '.check_suites[].id')

              for suite_id in $suites; do
                echo "Re-requesting check suite $suite_id for PR #$pr ($sha)"
                curl -X POST \
                  -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
                  -H "Accept: application/vnd.github+json" \
                  https://api.github.com/repos/vikas-wanchoo-devops/$repo/check-suites/$suite_id/rerequest
              done
            done
          done
