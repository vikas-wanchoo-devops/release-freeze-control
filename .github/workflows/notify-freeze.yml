  rerun-pr-workflows:
    runs-on: ubuntu-latest
    steps:
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Re-run PR workflows
        run: |
          repo="FlaskAPI-Docker-CICD"

          echo "Fetching recent workflow runs..."

          runs=$(curl -s -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/vikas-wanchoo-devops/$repo/actions/runs \
            | jq -r '.workflow_runs[]
              | select(.event=="pull_request")
              | select(.status=="completed")
              | .id')

          for run in $runs; do
            echo "Re-running workflow run ID: $run"

            curl -X POST \
              -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/vikas-wanchoo-devops/$repo/actions/runs/$run/rerun
          done
