name: Notify Freeze Change

on:
  push:
    paths:
      - "code-freeze-config/freeze.json"

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch freeze-updated event
        run: |
          echo "Dispatching freeze-updated event to FlaskAPI-Docker-CICD..."
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/vikas-wanchoo-devops/FlaskAPI-Docker-CICD/dispatches \
            -d '{"event_type":"freeze-updated"}'

  recheck-open-prs:
    runs-on: ubuntu-latest
    steps:
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Re-request Code Freeze checks on open PRs
        run: |
          repo="FlaskAPI-Docker-CICD"
          echo "Fetching open PRs for $repo..."

          prs=$(curl -s -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/vikas-wanchoo-devops/$repo/pulls?state=open | jq -r '.[].number')

          for pr in $prs; do
            echo "--------------------------------------"
            echo "Processing PR #$pr..."

            sha=$(curl -s -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/vikas-wanchoo-devops/$repo/pulls/$pr \
              | jq -r '.head.sha')

            echo "Latest SHA: $sha"

            check_run_id=$(curl -s -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/vikas-wanchoo-devops/$repo/commits/$sha/check-runs \
              | jq -r '.check_runs[]
                | select(.name=="Code Freeze Check / check-freeze (pull_request)")
                | .id')

            if [ -n "$check_run_id" ] && [ "$check_run_id" != "null" ]; then
              echo "Re-running check-run $check_run_id for PR #$pr"
              curl -X POST \
                -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
                -H "Accept: application/vnd.github+json" \
                https://api.github.com/repos/vikas-wanchoo-devops/$repo/check-runs/$check_run_id/rerequest
            else
              echo "No matching Code Freeze check found for PR #$pr"
              echo "Available checks:"
              curl -s -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
                -H "Accept: application/vnd.github+json" \
                https://api.github.com/repos/vikas-wanchoo-devops/$repo/commits/$sha/check-runs \
                | jq -r '.check_runs[].name'
            fi
          done
