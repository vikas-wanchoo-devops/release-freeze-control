name: Notify Freeze Change

on:
  push:
    paths:
      - "code-freeze-config/freeze.json"

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch freeze-updated event
        run: |
          echo "Dispatching freeze-updated event to FlaskAPI-Docker-CICD..."
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/vikas-wanchoo-devops/FlaskAPI-Docker-CICD/dispatches \
            -d '{"event_type":"freeze-updated"}'

  rerun-pr-workflows:
    runs-on: ubuntu-latest
    steps:
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Re-run PR workflows
        run: |
          repo="FlaskAPI-Docker-CICD"

          echo "Fetching recent workflow runs..."

          runs=$(curl -s -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/vikas-wanchoo-devops/$repo/actions/runs \
            | jq -r '.workflow_runs[]
              | select(.event=="pull_request")
              | select(.status=="completed")
              | .id')

          for run in $runs; do
            echo "Re-running workflow run ID: $run"

            curl -X POST \
              -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/vikas-wanchoo-devops/$repo/actions/runs/$run/rerun
          done
