name: Notify Freeze Change

on:
  push:
    paths:
      - "code-freeze-config/freeze.json"

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch freeze-updated event
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/vikas-wanchoo-devops/FlaskAPI-Docker-CICD/dispatches \
            -d '{"event_type":"freeze-updated"}'

      - name: Re-run checks on open PRs
        run: |
          repo="FlaskAPI-Docker-CICD"
          prs=$(curl -s -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/vikas-wanchoo-devops/$repo/pulls?state=open | jq -r '.[].number')

          for pr in $prs; do
            sha=$(curl -s -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/vikas-wanchoo-devops/$repo/pulls/$pr | jq -r '.head.sha')

            echo "Re-running Code Freeze Check for PR #$pr ($sha)"
            curl -X POST \
              -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/vikas-wanchoo-devops/$repo/actions/workflows/code-freeze.yml/dispatches \
              -d "{\"ref\":\"$sha\"}"
          done
